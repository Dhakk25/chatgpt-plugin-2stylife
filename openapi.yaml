openapi: 3.1.0
info:
  title: 2styLife Shopping Plugin
  description: Truy xuất sản phẩm mới nhất từ WooCommerce và các bài viết từ Instagram, Facebook.
  version: '1.0.0'
servers:
  - url: https://chatgpt-plugin-2stylife.onrender.com

paths:
  /products:
    get:
      operationId: getProducts
      summary: Lấy danh sách sản phẩm từ WooCommerce
      responses:
        "200":
          description: Danh sách sản phẩm mới nhất
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    link:
                      type: string

  /instagram-posts:
    get:
      operationId: getInstagramPosts
      summary: Lấy bài viết mới từ Instagram
      responses:
        "200":
          description: Danh sách bài viết Instagram
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    caption:
                      type: string
                    link:
                      type: string

  /facebook-posts:
    get:
      operationId: getFacebookPosts
      summary: Lấy bài đăng mới từ Facebook
      responses:
        "200":
          description: Danh sách bài đăng Facebook
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    link:
                      type: string
